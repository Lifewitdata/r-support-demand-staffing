name: Groq live API verification
# Opt-in only: this workflow makes real Groq API calls and consumes quota.
# Normal CI (python-analytics.yml) never needs credentials and stays fully mocked.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Groq model override (blank uses the code default)
        required: false
        type: string
      checks:
        description: Comma-separated checks
        required: false
        default: connectivity,analytics_assistant,conversation_analysis,prompt_injection
        type: string
permissions:
  contents: read
concurrency:
  group: groq-live-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Confirm the secret is available without printing it
        run: |
          if [ -z "${GROQ_API_KEY}" ]; then
            echo "::error::GROQ_API_KEY is not configured in repository secrets or is not exposed to this workflow."
            exit 2
          fi
          echo "GROQ_API_KEY is present. Its value, length and fingerprint are never printed."
      - name: Build a synthetic analytics database for the assistant check
        run: python src/commerce_analytics.py --days 14 --chats-per-day 30 --events config/events.example.csv
      - name: Run live Groq verification
        shell: bash
        run: python src/groq_live_check.py --checks "${{ inputs.checks }}" --json | tee groq-live-check.json
      - name: Publish the redacted result
        if: always()
        run: |
          if [ -f groq-live-check.json ]; then
            cat groq-live-check.json >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${GROQ_API_KEY}" ] && grep -qF "${GROQ_API_KEY}" groq-live-check.json; then
              echo "::error::The verification result contained the API key."
              exit 1
            fi
          fi
