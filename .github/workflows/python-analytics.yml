name: Python analytics checks
on:
  push:
    branches: [main, feature/conversational-commerce-python-sql]
    paths: ['python/**', '.github/workflows/python-analytics.yml']
  pull_request:
    paths: ['python/**', '.github/workflows/python-analytics.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Fast end-to-end smoke test on code changes
        if: github.event_name != 'schedule'
        run: python src/commerce_analytics.py --days 14 --chats-per-day 30 --events config/events.example.csv
      - name: Full daily analytics refresh
        if: github.event_name == 'schedule'
        run: python src/commerce_analytics.py --days 210 --chats-per-day 190 --events config/events.example.csv
      - name: Archive reproducible analytics outputs
        uses: actions/upload-artifact@v4
        with:
          name: commerce-analytics-outputs
          path: python/outputs/
          retention-days: 14
