name: R and Shiny checks

on:
  push:
    branches: [main]
    paths:
      - 'R/**'
      - 'app.R'
      - 'config/**'
      - 'data/processed/**'
      - 'data/raw/**'
      - 'www/**'
      - 'scripts/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - '.github/workflows/r-shiny-checks.yml'
  pull_request:
    paths:
      - 'R/**'
      - 'app.R'
      - 'config/**'
      - 'data/processed/**'
      - 'data/raw/**'
      - 'www/**'
      - 'scripts/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - '.github/workflows/r-shiny-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r-shiny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libuv1-dev pkg-config
      - name: Install R dependencies
        run: |
          install.packages(
            c('data.table', 'ggplot2', 'shiny', 'htmltools'),
            repos = 'https://cloud.r-project.org'
          )
          required <- c('data.table', 'ggplot2', 'shiny', 'htmltools')
          missing <- required[!vapply(required, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing)) {
            stop('Required R packages were not installed: ', paste(missing, collapse = ', '))
          }
        shell: Rscript {0}
      - name: Rebuild analysis outputs and app snapshot
        run: Rscript scripts/run_pipeline.R
      - name: Run analytical and Shiny server checks
        run: Rscript tests/run_tests.R
